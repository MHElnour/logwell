name: CI

# Changes that touch only docs or Markdown skip the code checks. Release notes still run them:
# release-check lints docs/releases/. Patterns are read in order; a later one wins.
# The release workflow also calls this workflow as its first stage (workflow_call).
on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "docs/releases/**"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "docs/releases/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Release notes are well formed and the index is current
        run: node scripts/release-check.mjs lint

name: CI

# Every pull request runs the checks: `main` requires the `check` job, so a skipped run would block
# the merge. On `main` itself, changes that touch only docs or Markdown skip them; release notes
# still run them (release-check lints docs/releases/). Patterns are read in order; a later one wins.
# The release workflow also calls this workflow as its first stage (workflow_call).
on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "docs/releases/**"
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Release notes are well formed and the index is current
        run: node scripts/release-check.mjs lint

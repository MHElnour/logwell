name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails the job unless the tag, manifest.json, package.json, versions.json and
      # docs/releases/<tag>.md agree. Writes the entries of that file to notes.md, the release body.
      - name: Verify the release
        run: node scripts/release-check.mjs verify "$GITHUB_REF_NAME" > notes.md

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Build attestation (Obsidian Scorecard). GitHub offers it only for public repositories on a
      # personal account, so it is skipped while the repository is private.
      - uses: actions/attest-build-provenance@v2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          if [ "${TAG%%.*}" = "0" ]; then flags="--prerelease"; fi
          gh release create "$TAG" main.js manifest.json styles.css --title "$TAG" --notes-file notes.md $flags
